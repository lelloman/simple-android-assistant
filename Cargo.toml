[workspace]
members = ["crates/assistant-core", "crates/assistant-jni", "crates/assistant-wasm"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
assistant-engine = { path = "crates/assistant-core" }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
